<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LBW Runner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e3a66'/%3E%3Cpath d='M12 10l-6 6 6 6M20 10l6 6-6 6' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%233dce7a'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #ffffff; --bg-subtle: #f3f6fb; --panel: #ffffff; --panel-2: #e7eef6;
    --ink: #10243f; --muted: #5c6d84; --line: #d5deea; --navy: #0e3a66; --on-navy: #ffffff;
    --accent: #14824a; --ok: #14824a; --warn: #a16207; --bad: #c2413a; --code-bg: #f4f7fb;
    --shadow: 0 16px 40px rgba(16, 36, 63, 0.1);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1424; --bg-subtle: #101a2e; --panel: #152238; --panel-2: #1c2d48;
      --ink: #e7eef8; --muted: #9aafc6; --line: #2c4060; --navy: #7eb0f0; --on-navy: #07111f;
      --accent: #3dce7a; --ok: #3dce7a; --warn: #e6c07b; --bad: #f0a090; --code-bg: #0a101c;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }
  }
  * { box-sizing: border-box; }
  /* A class that sets display must not show an element marked hidden. */
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg-subtle); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 0.9rem; padding: 0.9rem 1.5rem; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  .mark { width: 2rem; height: 2rem; flex: 0 0 auto; }
  .brand { font-weight: 650; letter-spacing: 0.02em; }
  .brand small { display: block; color: var(--muted); font-weight: 400; font-size: 0.78rem; letter-spacing: 0; }
  .spacer { flex: 1; }
  main { max-width: 64rem; margin: 0 auto; padding: 1.4rem 1.5rem 3rem; display: grid; gap: 1.1rem; }
  section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 1rem 1.1rem; }
  h2 { margin: 0 0 0.75rem; font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; display: flex; align-items: center; gap: 0.5rem; }
  .count { padding: 0 0.5rem; border: 1px solid var(--line); border-radius: 999px; background: var(--panel-2); font-size: 0.72rem; letter-spacing: 0; }
  button { font: inherit; font-size: 0.86rem; border-radius: 10px; padding: 0.45rem 0.85rem; border: 1px solid transparent; background: var(--navy); color: var(--on-navy); cursor: pointer; }
  button.secondary { background: var(--panel-2); color: var(--ink); border-color: var(--line); }
  button.danger { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
  button:disabled { opacity: 0.5; cursor: default; }
  .pill { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.15rem 0.65rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600; border: 1px solid var(--line); background: var(--panel-2); }
  .pill::before { content: ""; width: 0.5rem; height: 0.5rem; border-radius: 999px; background: var(--muted); }
  .pill.online::before { background: var(--ok); }
  .pill.paused::before { background: var(--warn); }
  .pill.off::before { background: var(--bad); }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 0.6rem 1.2rem; margin: 0; }
  .facts div { min-width: 0; }
  .facts dt { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .facts dd { margin: 0.1rem 0 0; overflow-wrap: anywhere; }
  .note { color: var(--muted); font-size: 0.82rem; margin: 0.6rem 0 0; }
  .empty { color: var(--muted); font-size: 0.88rem; margin: 0; }
  .job { border: 1px solid var(--line); border-radius: 8px; padding: 0.8rem 0.9rem; display: grid; gap: 0.45rem; border-left: 4px solid var(--navy); }
  .job + .job { margin-top: 0.7rem; }
  .job-top { display: flex; align-items: flex-start; gap: 0.8rem; }
  .job-goal { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  .job-meta { color: var(--muted); font-size: 0.82rem; display: flex; flex-wrap: wrap; gap: 0.2rem 0.9rem; }
  .job-meta a { color: var(--navy); }
  .phase { text-transform: capitalize; }
  .running-dot { display: inline-block; width: 0.55rem; height: 0.55rem; border-radius: 999px; background: var(--navy); margin-right: 0.35rem; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .running-dot { animation: none; } }
  .events { margin: 0; padding: 0.55rem 0.7rem; max-height: 14rem; overflow: auto; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; font: 0.78rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th { text-align: left; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 650; padding: 0.5rem 0.7rem; background: var(--panel-2); border-bottom: 1px solid var(--line); }
  td { padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--line); font-size: 0.88rem; vertical-align: top; overflow-wrap: anywhere; }
  tr:last-child td { border-bottom: 0; }
  .state { font-weight: 600; white-space: nowrap; }
  .state.done, .state.success { color: var(--ok); }
  .state.failed, .state.error { color: var(--bad); }
  .state.running { color: var(--navy); }
  .state.stopped { color: var(--warn); }
  .muted { color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  details[open] summary { margin-bottom: 0.6rem; }
  .log { max-height: 22rem; }
  form.link { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) auto; gap: 0.6rem; align-items: end; }
  label { display: grid; gap: 0.3rem; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; }
  input { font: inherit; font-size: 0.92rem; padding: 0.5rem 0.7rem; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-transform: none; letter-spacing: 0; }
  .code { font: 700 1.8rem ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.12em; margin: 0.4rem 0; }
  .update-banner { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; padding: 0.7rem 0.9rem; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--navy) 25%, var(--line)); border-left: 4px solid var(--navy); background: color-mix(in srgb, var(--navy) 7%, var(--panel)); font-size: 0.9rem; }
  .update-banner p { flex: 1; min-width: 14rem; margin: 0; }
  button.link { background: none; border: 0; padding: 0; color: var(--navy); text-decoration: underline; font-size: inherit; cursor: pointer; }
  .banner { padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); border-left: 4px solid var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--panel)); font-size: 0.88rem; }
  .error { color: var(--bad); font-size: 0.86rem; margin: 0.5rem 0 0; }
  .inbox { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
  .inbox-row { display: flex; align-items: center; gap: 0.9rem; padding: 0.7rem 0.85rem; border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 8px; background: color-mix(in srgb, var(--warn) 6%, var(--panel)); }
  .inbox-text { flex: 1; min-width: 0; }
  .inbox-title { font-weight: 600; color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
  .inbox-title:hover { text-decoration: underline; }
  .ask { flex: 0 0 auto; padding: 0.1rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 650; color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); background: var(--panel); white-space: nowrap; }
  a.button { display: inline-block; font-size: 0.86rem; border-radius: 10px; padding: 0.45rem 0.85rem; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); text-decoration: none; white-space: nowrap; }
  a.button:hover { border-color: var(--navy); }
  h3.sub { margin: 1rem 0 0.5rem; font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  h3.sub:first-child { margin-top: 0; }
  .actions { display: flex; gap: 0.4rem; justify-content: flex-end; }
  .toast { position: fixed; right: 1.2rem; bottom: 1.2rem; max-width: 26rem; padding: 0.7rem 0.9rem; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: 8px; box-shadow: var(--shadow); font-size: 0.88rem; }
  @media (max-width: 40rem) { form.link { grid-template-columns: 1fr; } header { flex-wrap: wrap; } }
</style>
</head>
<body>
<header>
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0e3a66"/><path d="M12 10l-6 6 6 6M20 10l6 6-6 6" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="16" r="3" fill="#3dce7a"/></svg>
  <div class="brand">LBW Runner<small id="subtitle">This machine</small></div>
  <span class="pill" id="connection">Starting…</span>
  <div class="spacer"></div>
  <button type="button" class="secondary" id="update-claude">Update Claude Code</button>
  <button type="button" id="pause">Pause new work</button>
</header>
<main>
  <section class="card" id="link-card" hidden>
    <h2>Link this machine</h2>
    <div id="link-body"></div>
  </section>
  <section class="card" id="inbox-card" hidden>
    <h2>Waiting for you <span class="count" id="waiting-count">0</span></h2>
    <div id="inbox"></div>
    <p class="error" id="inbox-error" hidden></p>
  </section>
  <div class="update-banner" id="update-banner" hidden>
    <p id="update-text"></p>
    <a class="button" id="update-notes" target="_blank" rel="noopener">What's new</a>
    <button type="button" id="install-update">Install update</button>
  </div>
  <div class="banner" id="paused-banner" hidden>Paused. Work already running goes on. New jobs and model calls wait in LBW until you resume.</div>
  <section class="card">
    <h2>This machine</h2>
    <dl class="facts" id="facts"></dl>
    <p class="note" id="update-output" hidden></p>
  </section>
  <section class="card">
    <h2>Running now <span class="count" id="running-count">0</span></h2>
    <div id="running"></div>
    <div id="lbw-running"></div>
  </section>
  <section class="card">
    <h2>Local model calls <span class="count" id="calls-count">0</span></h2>
    <div id="calls"></div>
  </section>
  <section class="card">
    <h2>Recent jobs</h2>
    <div id="recent"></div>
  </section>
  <section class="card">
    <details id="log-box">
      <summary>Runner log</summary>
      <pre class="events log" id="log"></pre>
    </details>
  </section>
</main>
<div class="toast" id="toast" hidden></div>
<script>
  "use strict";
  let last = null;
  let pending = null;
  let pointerHeld = false;
  let timer = 0;
  const written = new WeakMap();

  function el(id) {
    return document.getElementById(id);
  }

  function escapeHtml(value) {
    return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll("\"", "&quot;");
  }

  // Write only what changed, so a selection or an open log is left alone.
  function setHtml(node, html) {
    if (!node || written.get(node) === html) return false;
    node.innerHTML = html;
    written.set(node, html);
    return true;
  }

  function setText(node, text) {
    if (node && node.textContent !== text) node.textContent = text;
  }

  function selecting() {
    if (pointerHeld) return true;
    const selection = window.getSelection();
    return Boolean(selection && !selection.isCollapsed && selection.rangeCount);
  }

  function since(iso, until) {
    const start = Date.parse(iso);
    if (!Number.isFinite(start)) return "";
    const end = until ? Date.parse(until) : Date.now();
    const seconds = Math.max(0, Math.round((end - start) / 1000));
    if (seconds < 60) return seconds + "s";
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return minutes + "m " + (seconds % 60) + "s";
    return Math.floor(minutes / 60) + "h " + (minutes % 60) + "m";
  }

  function ago(iso) {
    const text = since(iso);
    return text ? text.split(" ")[0] + " ago" : "";
  }

  function tokens(count) {
    if (!count) return "";
    return count >= 1000 ? (count / 1000).toFixed(count >= 10000 ? 0 : 1) + "k tokens" : count + " tokens";
  }

  function firstLine(text) {
    return String(text || "").split("\n").find((line) => line.trim()) || "";
  }

  function lbwLink(job, server) {
    if (!server || !job.task_id) return "";
    const params = new URLSearchParams({ section: "changes", change: job.task_id });
    if (job.repository || job.project) params.set("project", job.repository || job.project);
    return server + "/?" + params.toString();
  }

  async function call(path, body) {
    const res = await fetch(path, {
      method: body === undefined ? "GET" : "POST",
      headers: body === undefined ? {} : { "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
      credentials: "same-origin",
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "the runner did not answer");
    return data;
  }

  function toast(message) {
    const node = el("toast");
    node.textContent = message;
    node.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { node.hidden = true; }, 6000);
  }

  function connectionLabel(status, paused) {
    if (status.connection === "online") return paused ? ["Paused", "paused"] : ["Online", "online"];
    if (status.connection === "connecting") return ["Connecting…", ""];
    if (status.connection === "disconnected") return ["Disconnected", "off"];
    return ["Not linked", "off"];
  }

  function renderFacts(status) {
    const rows = [
      ["LBW", status.server || "Not linked"],
      ["Listed as", status.name || "—"],
      ["Claude Code", status.claude_version || status.claude_error || "Not installed"],
      ["Local models", status.relay ? "Relayed to your model server" : "Relay off"],
      ["Sandbox", status.sandbox ? "On: shell commands stay in the job's worktree" : "Off"],
      ["Runner", (status.version || "dev") + " · " + (status.platform || "")],
    ];
    const update = status.runner_update || {};
    let versionNote = "";
    if (update.dev) versionNote = "Built from source: does not update itself";
    else if (update.error) versionNote = "Could not check for updates: " + update.error;
    else if (update.available) versionNote = update.latest + " is available";
    else if (update.checked) versionNote = "Up to date, checked " + ago(update.checked);
    else versionNote = "Not checked for updates yet";
    setHtml(el("facts"), rows.map(([name, value]) => `<div><dt>${escapeHtml(name)}</dt><dd>${escapeHtml(value)}${name === "Runner" && versionNote ? `<div class="muted">${escapeHtml(versionNote)}${update.dev ? "" : ` · <button type="button" class="link" id="check-update">Check now</button>`}</div>` : ""}</dd></div>`).join(""));
    renderUpdate(update, status.version);
    const output = el("update-output");
    output.hidden = !status.updating && !status.update_output;
    setText(output, status.updating ? "Updating Claude Code…" : (status.update_output || ""));
  }

  // Updates never install on their own: the person installs one from here.
  function renderUpdate(update, current) {
    const banner = el("update-banner");
    banner.hidden = !(update.available || update.installing);
    if (banner.hidden) return;
    setText(el("update-text"), update.installing
      ? `Installing LBW Runner ${update.latest}. The page comes back when the runner restarts.`
      : `LBW Runner ${update.latest} is available. This is ${current}. Installing restarts the runner and the tray icon.`);
    const notes = el("update-notes");
    notes.hidden = !update.url;
    if (update.url && notes.getAttribute("href") !== update.url) notes.setAttribute("href", update.url);
    const install = el("install-update");
    install.disabled = Boolean(update.installing);
    setText(install, update.installing ? "Installing…" : "Install update");
  }

  function renderLink(status) {
    const card = el("link-card");
    const needed = status.connection === "not_linked" || status.connection === "disconnected";
    card.hidden = !needed;
    if (!needed) return;
    const link = status.link;
    if (link && link.code && !link.error) {
      setHtml(el("link-body"), `
        <p class="note">Open <a href="${escapeHtml(link.url)}" target="_blank" rel="noopener">${escapeHtml(link.url)}</a> and enter this code under Integrations, Your machines:</p>
        <p class="code">${escapeHtml(link.code)}</p>
        <p class="note">Waiting for approval. This page carries on once you approve it.</p>`);
      return;
    }
    const intro = status.connection === "disconnected"
      ? "LBW disconnected this machine. Link it again to take jobs."
      : "Link this machine to your LBW account to run your jobs here.";
    setHtml(el("link-body"), `
      <p class="note">${escapeHtml(intro)}</p>
      <form class="link" id="link-form">
        <label>LBW address<input name="server" type="url" required placeholder="https://lbw.example.com" value="${escapeHtml(status.server || "")}"></label>
        <label>Listed as<input name="name" type="text" value="${escapeHtml(status.name || "")}"></label>
        <button type="submit" id="link-start">Link</button>
      </form>
      ${link && link.error ? `<p class="error">${escapeHtml(link.error)}</p>` : ""}`);
  }

  function jobCard(job, server) {
    const link = lbwLink(job, server);
    const events = (job.events || []).slice(-60).map((event) => event.message).join("\n");
    return `
      <article class="job">
        <div class="job-top">
          <div class="job-goal"><span class="running-dot" aria-hidden="true"></span>${escapeHtml(firstLine(job.goal) || "Job " + job.id)}</div>
          <button type="button" class="danger" data-stop-job="${escapeHtml(job.id)}" ${job.stopping ? "disabled" : ""}>${job.stopping ? "Stopping…" : "Stop"}</button>
        </div>
        <div class="job-meta">
          <span>${escapeHtml(job.repository || job.project || "")}</span>
          <span class="phase">${escapeHtml(job.phase)}</span>
          <span>${escapeHtml(job.model ? "Claude " + job.model : "Claude Code")}</span>
          <span data-since="${escapeHtml(job.started)}"></span>
          ${job.tokens ? `<span>${escapeHtml(tokens(job.tokens))}</span>` : ""}
          ${link ? `<a href="${escapeHtml(link)}" target="_blank" rel="noopener">Open in LBW</a>` : ""}
        </div>
        ${events ? `<pre class="events">${escapeHtml(events)}</pre>` : ""}
      </article>`;
  }

  function resultLabel(job) {
    if (job.stopping) return `<span class="state stopped">Stopped</span>`;
    if (job.status === "done") return `<span class="state done">Done</span>`;
    if (job.status === "failed") return `<span class="state failed">Failed</span>`;
    return `<span class="state">${escapeHtml(job.status)}</span>`;
  }

  function renderJobs(jobs, server, elsewhere) {
    const running = jobs.filter((job) => job.status === "running");
    const recent = jobs.filter((job) => job.status !== "running");
    setText(el("running-count"), String(running.length + elsewhere.length));
    const changed = setHtml(el("running"), running.length
      ? (elsewhere.length ? `<h3 class="sub">On this machine</h3>` : "") + running.map((job) => jobCard(job, server)).join("")
      : (elsewhere.length ? "" : `<p class="empty">Nothing of yours is running. Jobs you start on a "your machine" model run here.</p>`));
    // A new progress line keeps each job's log at its newest line.
    if (changed) {
      for (const pre of el("running").querySelectorAll(".events")) pre.scrollTop = pre.scrollHeight;
    }
    setHtml(el("recent"), recent.length ? `
      <table>
        <thead><tr><th>Job</th><th>Project</th><th>Step</th><th>Took</th><th>Result</th></tr></thead>
        <tbody>${recent.map((job) => {
          const link = lbwLink(job, server);
          const goal = escapeHtml(firstLine(job.goal) || job.id);
          return `<tr>
            <td>${link ? `<a href="${escapeHtml(link)}" target="_blank" rel="noopener">${goal}</a>` : goal}${job.error ? `<div class="muted">${escapeHtml(job.error)}</div>` : ""}</td>
            <td>${escapeHtml(job.repository || job.project || "")}</td>
            <td class="phase">${escapeHtml(job.phase)}</td>
            <td>${escapeHtml(since(job.started, job.ended))}</td>
            <td>${resultLabel(job)}</td>
          </tr>`;
        }).join("")}</tbody>
      </table>` : `<p class="empty">Nothing has run since the runner started.</p>`);
  }

  function statusLabel(status) {
    return status === "queued" ? "Queued" : status === "running" ? "Running" : status;
  }

  // The jobs you started that run in LBW, or on another of your machines.
  function renderElsewhere(items, server) {
    setHtml(el("lbw-running"), items.length ? `
      <h3 class="sub">In LBW</h3>
      <table>
        <thead><tr><th>Job</th><th>Project</th><th>Model</th><th>Started</th><th></th></tr></thead>
        <tbody>${items.map((item) => `<tr>
          <td><span class="state running">${escapeHtml(statusLabel(item.status))}</span> ${escapeHtml(item.title)}</td>
          <td>${escapeHtml(item.project)}</td>
          <td>${escapeHtml(item.model || "")}${item.on_runner ? ` <span class="muted">· another machine</span>` : ""}</td>
          <td data-ago="${escapeHtml(item.since)}"></td>
          <td><div class="actions">
            ${server ? `<a class="button" href="${escapeHtml(server + item.link)}" target="_blank" rel="noopener">Open</a>` : ""}
            <button type="button" class="danger" data-stop-task="${escapeHtml(item.id)}">Stop</button>
          </div></td>
        </tr>`).join("")}</tbody>
      </table>` : "");
  }

  function renderInbox(inbox, status) {
    const linked = status.connection === "online" || status.connection === "connecting";
    el("inbox-card").hidden = !linked;
    const waiting = inbox.waiting || [];
    setText(el("waiting-count"), String(waiting.length));
    setText(document.querySelector("title"), waiting.length ? `(${waiting.length}) LBW Runner` : "LBW Runner");
    const checked = Boolean(inbox.checked);
    setHtml(el("inbox"), waiting.length ? `<ul class="inbox">${waiting.map((item) => `
      <li class="inbox-row">
        <span class="ask">${escapeHtml(item.waiting_for || "Your turn")}</span>
        <div class="inbox-text">
          ${status.server ? `<a class="inbox-title" href="${escapeHtml(status.server + item.link)}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a>` : `<span class="inbox-title">${escapeHtml(item.title)}</span>`}
          <div class="muted">${escapeHtml([item.project, item.started_by ? "started by " + item.started_by : ""].filter(Boolean).join(" · "))} · waiting <span data-ago="${escapeHtml(item.since)}"></span></div>
        </div>
        ${status.server ? `<a class="button" href="${escapeHtml(status.server + item.link)}" target="_blank" rel="noopener">Open in LBW</a>` : ""}
      </li>`).join("")}</ul>`
      : `<p class="empty">${checked ? "Nothing is waiting for you. Plans, specs, and changes to approve show up here." : "Checking LBW…"}</p>`);
    const error = el("inbox-error");
    error.hidden = !inbox.error;
    setText(error, inbox.error ? "Could not read your inbox: " + inbox.error : "");
  }

  function renderCalls(calls, relay) {
    const live = calls.filter((item) => !item.ended);
    setText(el("calls-count"), String(live.length));
    if (!calls.length) {
      setHtml(el("calls"), `<p class="empty">${relay ? "No model call yet. Jobs on a local model send each call through here to your model server." : "The relay is off, so this runner sends no model calls."}</p>`);
      return;
    }
    setHtml(el("calls"), `
      <table>
        <thead><tr><th>Model</th><th>Call</th><th>Started</th><th>Took</th><th>Result</th></tr></thead>
        <tbody>${calls.map((item) => {
          const kind = item.path === "/v1/models" ? "List models" : "Chat";
          const result = !item.ended ? `<span class="state running">Running</span>`
            : item.error ? `<span class="state failed">Failed</span><div class="muted">${escapeHtml(item.error)}</div>`
            : `<span class="state ${item.status < 400 ? "done" : "failed"}">${escapeHtml(String(item.status))}</span>`;
          return `<tr>
            <td>${escapeHtml(item.model || "—")}</td>
            <td>${escapeHtml(kind)}</td>
            <td data-ago="${escapeHtml(item.started)}"></td>
            <td ${item.ended ? "" : `data-since="${escapeHtml(item.started)}"`}>${item.ended ? escapeHtml(since(item.started, item.ended)) : ""}</td>
            <td>${result}</td>
          </tr>`;
        }).join("")}</tbody>
      </table>`);
  }

  function render(data) {
    const status = data.status;
    const work = data.work;
    const [label, tone] = connectionLabel(status, work.paused);
    const pill = el("connection");
    setText(pill, label);
    pill.className = "pill " + tone;
    setText(el("subtitle"), status.name ? status.name + " · " + (status.server || "") : "This machine");
    const pause = el("pause");
    setText(pause, work.paused ? "Resume" : "Pause new work");
    pause.disabled = status.connection !== "online";
    el("paused-banner").hidden = !work.paused;
    const update = el("update-claude");
    update.disabled = status.updating || !status.claude_version;
    setText(update, status.updating ? "Updating…" : "Update Claude Code");
    renderLink(status);
    renderFacts(status);
    const inbox = data.inbox || { waiting: [], running: [] };
    renderInbox(inbox, status);
    const here = new Set((work.jobs || []).filter((job) => job.status === "running").map((job) => job.task_id));
    const elsewhere = (inbox.running || []).filter((item) => !here.has(item.id));
    renderJobs(work.jobs || [], status.server, elsewhere);
    renderElsewhere(elsewhere, status.server);
    renderCalls(work.calls || [], status.relay);
    const log = el("log");
    const text = (work.log || []).join("\n");
    if (log.textContent !== text) {
      const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 8;
      log.textContent = text;
      if (atEnd) log.scrollTop = log.scrollHeight;
    }
    tick();
  }

  // Tick elapsed times in place, without redrawing the cards.
  function tick() {
    for (const node of document.querySelectorAll("[data-since]")) setText(node, since(node.dataset.since));
    for (const node of document.querySelectorAll("[data-ago]")) setText(node, ago(node.dataset.ago));
  }

  function show(data) {
    last = data;
    if (selecting()) {
      pending = data;
      return;
    }
    pending = null;
    render(data);
  }

  async function poll() {
    clearTimeout(timer);
    if (document.hidden) return;
    try {
      show(await call("/api/state"));
    } catch (err) {
      setText(el("connection"), "Runner stopped");
      el("connection").className = "pill off";
    }
    timer = setTimeout(poll, 2000);
  }

  async function act(path, body) {
    try {
      show(await call(path, body));
    } catch (err) {
      toast(err.message);
    }
  }

  el("pause").addEventListener("click", function () {
    act("/api/pause", { paused: !(last && last.work.paused) });
  });
  el("install-update").addEventListener("click", function () {
    if (!window.confirm("Install the update now? The runner restarts. Jobs on this machine must be finished first.")) return;
    el("install-update").disabled = true;
    act("/api/update", {});
  });
  el("facts").addEventListener("click", function (event) {
    if (event.target.closest("#check-update")) act("/api/update/check", {});
  });
  el("update-claude").addEventListener("click", function () {
    act("/api/update-claude", {});
  });
  el("running").addEventListener("click", function (event) {
    const button = event.target.closest("[data-stop-job]");
    if (!button) return;
    if (!window.confirm("Stop this job? LBW marks it failed, and you can rerun it from LBW.")) return;
    act("/api/jobs/" + encodeURIComponent(button.dataset.stopJob) + "/stop", {});
  });
  el("lbw-running").addEventListener("click", function (event) {
    const button = event.target.closest("[data-stop-task]");
    if (!button) return;
    if (!window.confirm("Stop this job in LBW? It ends as failed, and you can rerun it.")) return;
    button.disabled = true;
    act("/api/tasks/" + encodeURIComponent(button.dataset.stopTask) + "/stop", {});
  });
  el("link-body").addEventListener("submit", function (event) {
    event.preventDefault();
    const form = new FormData(event.target);
    const button = el("link-start");
    if (button) button.disabled = true;
    act("/api/link", { server: form.get("server"), name: form.get("name") });
  });
  document.addEventListener("pointerdown", function () { pointerHeld = true; });
  document.addEventListener("pointerup", function () {
    pointerHeld = false;
    requestAnimationFrame(function () { if (pending && !selecting()) show(pending); });
  });
  document.addEventListener("selectionchange", function () {
    if (pending && !selecting()) show(pending);
  });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) poll();
  });
  setInterval(tick, 1000);
  poll();
</script>
</body>
</html>
