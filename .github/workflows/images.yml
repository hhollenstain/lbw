name: Images

# Builds LBW's container images for linux/amd64 and linux/arm64.
# - Pull requests: build only, nothing is pushed and nothing authenticates.
# - Push to main (or a manual run on main): build and push to the lbw-tools
#   `docker` Artifact Registry repo, tagged with the commit SHA and `latest`.
#
# Pull them through docker-virtual, e.g.
#   us-central1-docker.pkg.dev/lbw-tools/docker-virtual/lbw-crossing:sha-<sha7>
#
# Pushing signs in through Workload Identity Federation as gh-lbw-images
# (iac-gcp tools/lbw-tools, outputs github_workload_identity_provider and
# github_ci_service_accounts): writer on `docker` only, usable only from
# lbways/lbw on refs/heads/main. Neither value is a secret.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  # Never cancel a push half way through on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY_HOST: us-central1-docker.pkg.dev
  REGISTRY: us-central1-docker.pkg.dev/lbw-tools/docker
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/216803784818/locations/global/workloadIdentityPools/github/providers/github-actions
  GCP_SERVICE_ACCOUNT: gh-lbw-images@lbw-tools.iam.gserviceaccount.com

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Workload Identity Federation, used only when pushing
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: lbw-agent
            context: .
            dockerfile: Dockerfile
          - image: lbw-crossing
            context: .
            dockerfile: services/crossing/Dockerfile
    env:
      # Push only from main. The service account can't be used from any other
      # ref anyway, so this keeps branch runs from failing at sign-in.
      PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - id: auth
        if: env.PUSH == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
