name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Check OpenAPI models match the spec
        run: make openapi-check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pytest
        run: uv run pytest -q -m "not runner_e2e"

  runner-e2e:
    name: Runner end to end (local models)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.mod

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build lbw-runner and relay a job to a fake Ollama
        env:
          LBW_REQUIRE_RUNNER_E2E: "1"
        run: uv run pytest -q -m runner_e2e

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the React bundle matches web/src
        run: make web-check

  runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod

      - name: Vet and test the runner
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Build every release target
        run: make dist

  runner-macos:
    # macOS builds the runner with cgo for its menu bar icon, so check that
    # build on a Mac here instead of first at release time.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum

      - name: Test, and build both Mac architectures with the menu bar icon
        run: |
          go vet ./...
          go test ./...
          for arch in arm64 amd64; do
            clang_arch=arm64
            if [ "$arch" = amd64 ]; then clang_arch=x86_64; fi
            CGO_ENABLED=1 CC="clang -arch $clang_arch" GOOS=darwin GOARCH=$arch \
              go build -o "/tmp/lbw-runner-$arch" ./cmd/lbw-runner
            otool -L "/tmp/lbw-runner-$arch" | grep -q AppKit
          done

      - name: Cross-build Linux and Windows without cgo
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/lbw-runner
          done
