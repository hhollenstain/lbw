name: Web bundle (temporary)

on:
  pull_request:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the React bundle
        run: |
          cd web && npm ci
          LBW_WEB_OUT="$GITHUB_WORKSPACE/.web-bundle" npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: .web-bundle/
