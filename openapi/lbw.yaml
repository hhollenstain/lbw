openapi: 3.1.0
info:
  title: LBW
  version: 0.1.0
  description: >
    The organization API. Add a route here first, then run make openapi.
    Handlers use the generated models in src/agent_lbw/openapi_models.py.
paths:
  /api/schedules:
    post:
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleWrite"
      responses:
        "200":
          description: The saved schedule.
  /api/repo-rules:
    get:
      operationId: listRepoRules
      responses:
        "200":
          description: Instruction files from the primary branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoRuleList"
    put:
      operationId: setRepoRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoRuleWrite"
      responses:
        "200":
          description: The instruction files after one switch changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoRuleList"
  /api/audit:
    get:
      operationId: listAudit
      responses:
        "200":
          description: Recent notes of who changed the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
  /api/org/endpoints/{endpoint_id}/credential:
    post:
      operationId: saveEndpointCredential
      parameters:
        - name: endpoint_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointCredential"
      responses:
        "200":
          description: The organization catalog after this person checks a key.
  /api/org/endpoints:
    post:
      operationId: createEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointWrite"
      responses:
        "200":
          description: The organization catalog after the endpoint is saved.
  /api/org/agent-teams:
    post:
      operationId: createAgentTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTeamWrite"
      responses:
        "200":
          description: Organization settings after the team is created.
  /api/org/agent-teams/{team_id}:
    put:
      operationId: updateAgentTeam
      parameters:
        - name: team_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTeamUpdate"
      responses:
        "200":
          description: Organization settings after the team changes.
    delete:
      operationId: deleteAgentTeam
      parameters:
        - name: team_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization settings after the team is removed.
  /api/me/integrations:
    get:
      operationId: listMyIntegrations
      responses:
        "200":
          description: The integrations the organization turned on, and how this person linked each.
  /api/me/integrations/{endpoint_id}:
    delete:
      operationId: unlinkIntegration
      parameters:
        - name: endpoint_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: This person's integrations after the link is removed.
  /api/org/prices:
    get:
      operationId: listModelPrices
      responses:
        "200":
          description: >-
            Each model the organization runs with the price a run uses: the
            organization's own price, or else the public list price. Also the
            prices the organization set, and when the list was last refreshed.
    put:
      operationId: saveModelPrice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceWrite"
      responses:
        "200":
          description: The price table after the change.
    delete:
      operationId: deleteModelPrice
      parameters:
        - name: provider
          in: query
          schema:
            type: string
        - name: model
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The price table after the change.
  /api/org/prices/refresh:
    post:
      operationId: refreshListPrices
      responses:
        "200":
          description: >-
            The price table after the public list prices are fetched again. An
            owner or admin refreshes them. Runs already recorded keep their cost.
  /api/tasks/{task_id}/estimate:
    get:
      operationId: estimateBuild
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            Tokens and cost a planned change should spend to build, scaled from
            its planning tokens by this project's or this organization's recent
            builds, and priced on the change's model.
  /api/usage/meta:
    get:
      operationId: usageRegistry
      responses:
        "200":
          description: The datasets, breakdowns, and numbers a usage report can ask for.
  /api/usage:
    get:
      operationId: usageReport
      parameters:
        - name: scope
          in: query
          description: org, project, or me.
          schema:
            type: string
        - name: dataset
          in: query
          schema:
            type: string
        - name: group_by
          in: query
          description: Up to two breakdowns, comma separated.
          schema:
            type: string
        - name: measures
          in: query
          description: Comma separated measure keys.
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
        - name: until
          in: query
          schema:
            type: string
        - name: format
          in: query
          description: json or csv.
          schema:
            type: string
      responses:
        "200":
          description: Totals, top groups, and a daily series from the usage rollups.
  /api/workspaces/agent-teams/import-roles:
    post:
      operationId: importRolesAsAgentTeams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTeamImport"
      responses:
        "200":
          description: Agent teams after this project's roles become teams that are on.
  /api/workspaces/agent-teams:
    put:
      operationId: setProjectAgentTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTeamProjectWrite"
      responses:
        "200":
          description: Agent teams after one project switch changes.
  /api/workspaces/models:
    get:
      operationId: listProjectModels
      responses:
        "200":
          description: Models for the current project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectModelList"
    put:
      operationId: setProjectModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectModelWrite"
      responses:
        "200":
          description: Models after one project switch changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectModelList"
  /api/workspaces/favorites:
    put:
      operationId: setProjectFavorite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectFavoriteWrite"
      responses:
        "200":
          description: The signed-in person's favorite projects after one star changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFavoriteList"
  /api/github/repos/enabled:
    put:
      operationId: setGitHubRepoEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoEnabled"
      responses:
        "200":
          description: The repositories after one switch changes.
  /api/runner/link:
    post:
      operationId: startRunnerLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerLinkStart"
      responses:
        "200":
          description: A device code for the runner to keep and a short code for the person to enter.
  /api/runner/link/token:
    post:
      operationId: claimRunnerToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerLinkToken"
      responses:
        "200":
          description: The runner's own token, returned once after the person approves.
        "428":
          description: The person has not entered the code yet.
  /api/runner/heartbeat:
    post:
      operationId: runnerHeartbeat
      description: Runner-token auth. Reports health and returns maintenance commands.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerHeartbeat"
      responses:
        "200":
          description: Commands for the runner, such as update_claude.
  /api/runner/jobs/next:
    get:
      operationId: leaseRunnerJob
      description: Runner-token auth. Waits up to `wait` seconds for a job.
      parameters:
        - name: wait
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: The leased job, with its goal and the commit to start from.
        "204":
          description: No job is waiting.
  /api/runner/jobs/{job_id}/events:
    post:
      operationId: postRunnerEvents
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerEvents"
      responses:
        "200":
          description: Extends the lease. Says whether the job was cancelled.
  /api/runner/jobs/{job_id}/finish:
    post:
      operationId: finishRunnerJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerFinish"
      responses:
        "200":
          description: The result was handed to the waiting job.
  /api/me/runners:
    get:
      operationId: listRunners
      responses:
        "200":
          description: This person's runners, or everyone's for an owner or admin.
  /api/me/runners/approve:
    post:
      operationId: approveRunner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerApprove"
      responses:
        "200":
          description: The runner showing this code now belongs to the signed-in person.
  /api/me/runners/{runner_id}:
    delete:
      operationId: revokeRunner
      parameters:
        - name: runner_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The runner's token stops working and its waiting jobs are cancelled.
  /api/me/runners/{runner_id}/update-claude:
    post:
      operationId: updateRunnerClaude
      parameters:
        - name: runner_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The runner runs `claude update` at its next heartbeat.
  /api/runner/llm/next:
    get:
      operationId: nextRunnerModelCall
      description: >-
        Runner-token auth. Waits up to `wait` seconds for a model call LBW makes for
        this runner's owner, to relay to the model server the owner set.
      parameters:
        - name: wait
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: The call's id, method, path, body, and the owner's server address.
        "204":
          description: No call is waiting.
  /api/tasks/{task_id}/checks:
    get:
      operationId: listTaskChecks
      description: >-
        The CI checks on the head commit of this job's pull request, failed
        ones first. Read from GitHub with the organization's GitHub App and
        cached for 30 seconds; refresh=true reads them again.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
        - name: refresh
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: >-
            pr_url, sha, state (failing, pending, passing, or none), checks
            (name, state, conclusion, url, summary), and the failed names.
        "404":
          description: The job is gone or has no pull request.
        "409":
          description: GitHub could not say what the checks are.
  /api/tasks/{task_id}/checks/investigate:
    post:
      operationId: investigateTaskChecks
      description: >-
        Start the next run of this job on its open pull request to fix failed
        checks. The run reads what the checks printed, writes a fix, and waits
        for approval. Approving pushes the fix to the pull request.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestigateChecks"
      responses:
        "201":
          description: The investigation run.
        "404":
          description: The job is gone or has no pull request.
        "409":
          description: The pull request is not open, or no check has failed.
  /api/tasks/{task_id}/rerun:
    post:
      operationId: rerunTask
      description: >-
        Queue a new run of a finished or failed job on its branch. The person
        picks the model: an empty model_id keeps the job's model.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RerunPayload"
      responses:
        "201":
          description: The new run.
        "400":
          description: The job cannot be rerun, or the model is not usable here.
        "409":
          description: The model is gone, the pull request is closed, or a runner or link is required.
  /api/runner/llm/{call_id}/ack:
    post:
      operationId: ackRunnerModelCall
      description: >-
        Runner-token auth. The runner that took a model call confirms it has it.
        A call nobody confirms within a few seconds is offered again.
      parameters:
        - name: call_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The call is this runner's to answer.
        "409":
          description: The call was offered again or is gone. Do not relay it.
  /api/runner/llm/{call_id}:
    post:
      operationId: answerRunnerModelCall
      parameters:
        - name: call_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerModelAnswer"
      responses:
        "200":
          description: The answer was handed to the waiting model call.
        "409":
          description: LBW is no longer waiting for this call.
  /api/org/specs:
    get:
      operationId: getOrgSpecPolicy
      responses:
        "200":
          description: Whether every project's proposals must start from a spec.
    put:
      operationId: setOrgSpecPolicy
      description: An organization owner or admin requires a spec on every project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecPolicy"
      responses:
        "200":
          description: The policy after the change.
        "403":
          description: Only an organization owner or admin can change it.
  /api/workspaces/specs:
    get:
      operationId: getProjectSpecPolicy
      parameters:
        - name: path
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: >-
            Whether this project's proposals must start from a spec, and whether
            the organization or the project requires it.
    put:
      operationId: setProjectSpecPolicy
      description: >-
        A person who manages the project requires a spec for its proposals. It
        cannot loosen what the organization requires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectSpecPolicy"
      responses:
        "200":
          description: The policy after the change.
        "403":
          description: Only a person who manages the project can change it.
  /api/tasks/{task_id}/decide:
    post:
      operationId: decideTask
      description: >-
        A person with write access decides a job waiting at a gate. At the spec
        gate, accept_spec continues with the spec (spec_text replaces it when
        given), send_back rewrites it from the note, and hand_off stops.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecidePayload"
      responses:
        "200":
          description: The job after the decision.
        "409":
          description: The job is not waiting for that decision.
  /api/org/local-models:
    get:
      operationId: getLocalModelPolicy
      responses:
        "200":
          description: Who may use a model server on their own machine. People are listed for an owner or admin.
    put:
      operationId: setLocalModelPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalModelPolicy"
      responses:
        "200":
          description: The policy after the change.
  /api/org/local-models/people/{identity_id}:
    put:
      operationId: setLocalModelPerson
      parameters:
        - name: identity_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalModelPerson"
      responses:
        "200":
          description: The policy after turning local models on or off for this person.
  /api/me/local-model:
    get:
      operationId: getMyLocalModel
      responses:
        "200":
          description: This person's model server, its synced model names, and whether the organization allows it.
    put:
      operationId: saveMyLocalModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalModelServer"
      responses:
        "200":
          description: The saved server.
  /api/me/local-model/sync:
    post:
      operationId: syncMyLocalModel
      responses:
        "200":
          description: The model names the server returned through this person's runner.
        "409":
          description: No runner of this person's that relays model calls is online.
components:
  schemas:
    ScheduleCadence:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
        minute:
          type: integer
          default: 0
        hour:
          type: integer
          default: 9
        weekdays:
          type: array
          items:
            type: integer
    ScheduleWrite:
      type: object
      required: [name, goal, cadence]
      properties:
        name:
          type: string
        goal:
          type: string
        workspace:
          type: string
          default: ""
        kind:
          type: string
          default: project
        enabled:
          type: boolean
          default: true
        auto_commit:
          type: boolean
          default: true
        create_pr:
          type: boolean
          default: true
        base_branch:
          type: string
          default: ""
        model_id:
          type: string
          default: ""
        cadence:
          $ref: "#/components/schemas/ScheduleCadence"
    AuditEntry:
      type: object
      required: [id, at, action, summary]
      properties:
        id:
          type: string
        at:
          type: string
        actor_id:
          type: string
          default: ""
        actor_name:
          type: string
          default: ""
        action:
          type: string
        method:
          type: string
          default: ""
        path:
          type: string
          default: ""
        target_type:
          type: string
          default: ""
        target_id:
          type: string
          default: ""
        summary:
          type: string
        detail:
          type: string
          default: ""
    AuditList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
    RepoRuleFile:
      type: object
      required: [path, enabled, body, html]
      properties:
        path:
          type: string
        enabled:
          type: boolean
        body:
          type: string
        html:
          type: string
          description: The body rendered as HTML for the page. Raw HTML in the file is escaped.
    RepoRuleList:
      type: object
      required: [branch, files]
      properties:
        branch:
          type: string
          default: ""
        files:
          type: array
          items:
            $ref: "#/components/schemas/RepoRuleFile"
    RepoRuleWrite:
      type: object
      required: [path, enabled]
      properties:
        workspace:
          type: string
          default: ""
        path:
          type: string
        enabled:
          type: boolean
    EndpointCredential:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: string
    EndpointWrite:
      type: object
      required: [name, provider]
      properties:
        name:
          type: string
        provider:
          type: string
        base_url:
          type: string
          default: ""
        api_key:
          type: string
          default: ""
        auth:
          type: string
          default: key
        audience:
          type: string
          default: ""
    ProjectModel:
      type: object
      required: [id, name, provider, model_name, endpoint_name, org_enabled, enabled]
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        model_name:
          type: string
        endpoint_name:
          type: string
          default: ""
        org_enabled:
          type: boolean
        enabled:
          type: boolean
        endpoint_id:
          type: string
          default: ""
        auth:
          type: string
          default: key
        signed_in:
          type: boolean
          default: true
    ProjectModelList:
      type: object
      required: [can_manage, models]
      properties:
        can_manage:
          type: boolean
        models:
          type: array
          items:
            $ref: "#/components/schemas/ProjectModel"
    AgentTeamStep:
      type: object
      required: [key, job]
      properties:
        key:
          type: string
        job:
          type: string
        after:
          type: array
          items:
            type: string
        paths:
          type: array
          items:
            type: string
    AgentTeamWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
        job:
          type: string
          default: ""
        instruction:
          type: string
          default: ""
        model_id:
          type: string
          default: ""
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AgentTeamStep"
    AgentTeamUpdate:
      type: object
      required: [name, instruction, model_id, steps]
      properties:
        name:
          type: string
        instruction:
          type: string
        model_id:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AgentTeamStep"
    PriceWrite:
      type: object
      required: [model, input_per_mtok, output_per_mtok]
      properties:
        provider:
          type: string
          default: ""
        model:
          type: string
        input_per_mtok:
          type: number
        output_per_mtok:
          type: number
        cache_read_per_mtok:
          type: number
          default: 0
        cache_write_per_mtok:
          type: number
          default: 0
    AgentTeamImport:
      type: object
      properties:
        path:
          type: string
          default: ""
    AgentTeamProjectWrite:
      type: object
      required: [team_id, enabled]
      properties:
        path:
          type: string
          default: ""
        team_id:
          type: string
        enabled:
          type: boolean
    ProjectFavoriteWrite:
      type: object
      required: [project_id, favorite]
      properties:
        project_id:
          type: string
        favorite:
          type: boolean
    ProjectFavoriteList:
      type: object
      required: [favorites]
      properties:
        favorites:
          type: array
          items:
            type: string
    ProjectModelWrite:
      type: object
      required: [model_id, enabled]
      properties:
        path:
          type: string
          default: ""
        model_id:
          type: string
        enabled:
          type: boolean
    RepoEnabled:
      type: object
      required: [project_id, enabled]
      properties:
        project_id:
          type: string
        enabled:
          type: boolean
    TaskActor:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    TaskGate:
      type: object
      required: [action, at, actor]
      properties:
        action:
          type: string
        at:
          type: string
        note:
          type: string
          default: ""
        actor:
          $ref: "#/components/schemas/TaskActor"
    RunnerLinkStart:
      type: object
      required: [name]
      properties:
        name:
          type: string
        platform:
          type: string
          default: ""
    RunnerLinkToken:
      type: object
      required: [device_code]
      properties:
        device_code:
          type: string
    RunnerApprove:
      type: object
      required: [user_code]
      properties:
        user_code:
          type: string
    RunnerHeartbeat:
      type: object
      properties:
        version:
          type: string
          default: ""
        claude_version:
          type: string
          default: ""
        claude_ready:
          type: boolean
          default: false
        platform:
          type: string
          default: ""
        llm_relay:
          type: boolean
          default: false
    RunnerEvents:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
    SpecPolicy:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
    ProjectSpecPolicy:
      type: object
      required: [path, required]
      properties:
        path:
          type: string
        required:
          type: boolean
    DecidePayload:
      type: object
      properties:
        decision:
          type: string
          enum: [accept_spec, build, hand_off, approve, send_back, continue]
        note:
          type: string
          default: ""
        spec_text:
          type: string
          default: ""
          description: The spec as the person edited it, with accept_spec.
    RerunPayload:
      type: object
      properties:
        sha:
          type: string
          nullable: true
        goal:
          type: string
          nullable: true
        model_id:
          type: string
          nullable: true
          description: A model from the job form's list. Empty keeps the job's model.
        triage_gate:
          type: string
          default: ""
          description: ask or auto. Empty keeps the job's own plan review.
        approval_gate:
          type: string
          default: ""
          description: ask or auto. Empty keeps the job's own approval.
        spec:
          type: boolean
          default: false
          description: Write a spec first. A job that already has a spec keeps it.
    InvestigateChecks:
      type: object
      properties:
        checks:
          type: array
          items:
            type: string
          default: []
          description: The failed checks to fix, by name. Empty means every failed check.
    RunnerModelAnswer:
      type: object
      required: [status]
      properties:
        status:
          type: integer
        body:
          type: string
          default: ""
        error:
          type: string
          default: ""
    LocalModelPolicy:
      type: object
      required: [policy]
      properties:
        policy:
          type: string
    LocalModelPerson:
      type: object
      required: [allowed]
      properties:
        allowed:
          type: boolean
    LocalModelServer:
      type: object
      required: [enabled, provider]
      properties:
        enabled:
          type: boolean
        provider:
          type: string
        base_url:
          type: string
          default: ""
    RunnerFinish:
      type: object
      required: [status]
      properties:
        status:
          type: string
        summary:
          type: string
          default: ""
        error:
          type: string
          default: ""
        patch:
          type: string
          default: ""
