openapi: 3.1.0
info:
  title: LBW
  version: 0.1.0
  description: >
    The organization API. Add a route here first, then run make openapi.
    Handlers use the generated models in src/agent_lbw/openapi_models.py.
paths:
  /api/schedules:
    post:
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleWrite"
      responses:
        "200":
          description: The saved schedule.
  /api/repo-rules:
    get:
      operationId: listRepoRules
      responses:
        "200":
          description: Instruction files from the primary branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoRuleList"
    put:
      operationId: setRepoRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoRuleWrite"
      responses:
        "200":
          description: The instruction files after one switch changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoRuleList"
  /api/audit:
    get:
      operationId: listAudit
      responses:
        "200":
          description: Recent notes of who changed the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
  /api/org/endpoints/{endpoint_id}/credential:
    post:
      operationId: saveEndpointCredential
      parameters:
        - name: endpoint_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointCredential"
      responses:
        "200":
          description: The organization catalog after this person checks a key.
  /api/org/endpoints:
    post:
      operationId: createEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointWrite"
      responses:
        "200":
          description: The organization catalog after the endpoint is saved.
  /api/org/agent-teams:
    post:
      operationId: createAgentTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTeamWrite"
      responses:
        "200":
          description: Organization settings after the team is created.
  /api/org/agent-teams/{team_id}:
    put:
      operationId: updateAgentTeam
      parameters:
        - name: team_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTeamUpdate"
      responses:
        "200":
          description: Organization settings after the team changes.
    delete:
      operationId: deleteAgentTeam
      parameters:
        - name: team_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization settings after the team is removed.
  /api/me/integrations:
    get:
      operationId: listMyIntegrations
      responses:
        "200":
          description: The integrations the organization turned on, and how this person linked each.
  /api/me/integrations/{endpoint_id}:
    delete:
      operationId: unlinkIntegration
      parameters:
        - name: endpoint_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: This person's integrations after the link is removed.
  /api/me/integrations/{endpoint_id}/claude-link:
    post:
      operationId: startClaudeLink
      parameters:
        - name: endpoint_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The Anthropic approval page to open.
  /api/integrations/claude/callback:
    get:
      operationId: finishClaudeLink
      responses:
        "303":
          description: Back to the profile after Anthropic's approval page.
  /api/org/claude-link:
    get:
      operationId: readClaudeLinkApp
      responses:
        "200":
          description: Whether people can link a Claude organization. No secret is returned.
    put:
      operationId: saveClaudeLinkApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaudeLinkWrite"
      responses:
        "200":
          description: The saved Claude link settings.
    delete:
      operationId: removeClaudeLinkApp
      responses:
        "200":
          description: The Claude link settings after removal.
  /api/org/prices:
    get:
      operationId: listModelPrices
      responses:
        "200":
          description: Dollars per million tokens for each model the organization prices.
    put:
      operationId: saveModelPrice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceWrite"
      responses:
        "200":
          description: The price table after the change.
    delete:
      operationId: deleteModelPrice
      parameters:
        - name: provider
          in: query
          schema:
            type: string
        - name: model
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The price table after the change.
  /api/usage/meta:
    get:
      operationId: usageRegistry
      responses:
        "200":
          description: The datasets, breakdowns, and numbers a usage report can ask for.
  /api/usage:
    get:
      operationId: usageReport
      parameters:
        - name: scope
          in: query
          description: org, project, or me.
          schema:
            type: string
        - name: dataset
          in: query
          schema:
            type: string
        - name: group_by
          in: query
          description: Up to two breakdowns, comma separated.
          schema:
            type: string
        - name: measures
          in: query
          description: Comma separated measure keys.
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
        - name: until
          in: query
          schema:
            type: string
        - name: format
          in: query
          description: json or csv.
          schema:
            type: string
      responses:
        "200":
          description: Totals, top groups, and a daily series from the usage rollups.
  /api/workspaces/agent-teams/import-roles:
    post:
      operationId: importRolesAsAgentTeams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTeamImport"
      responses:
        "200":
          description: Agent teams after this project's roles become teams that are on.
  /api/workspaces/agent-teams:
    put:
      operationId: setProjectAgentTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTeamProjectWrite"
      responses:
        "200":
          description: Agent teams after one project switch changes.
  /api/workspaces/models:
    get:
      operationId: listProjectModels
      responses:
        "200":
          description: Models for the current project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectModelList"
    put:
      operationId: setProjectModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectModelWrite"
      responses:
        "200":
          description: Models after one project switch changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectModelList"
  /api/github/repos/enabled:
    put:
      operationId: setGitHubRepoEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoEnabled"
      responses:
        "200":
          description: The repositories after one switch changes.
components:
  schemas:
    ScheduleCadence:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
        minute:
          type: integer
          default: 0
        hour:
          type: integer
          default: 9
        weekdays:
          type: array
          items:
            type: integer
    ScheduleWrite:
      type: object
      required: [name, goal, cadence]
      properties:
        name:
          type: string
        goal:
          type: string
        workspace:
          type: string
          default: ""
        kind:
          type: string
          default: project
        enabled:
          type: boolean
          default: true
        auto_commit:
          type: boolean
          default: true
        create_pr:
          type: boolean
          default: true
        base_branch:
          type: string
          default: ""
        model_id:
          type: string
          default: ""
        cadence:
          $ref: "#/components/schemas/ScheduleCadence"
    AuditEntry:
      type: object
      required: [id, at, action, summary]
      properties:
        id:
          type: string
        at:
          type: string
        actor_id:
          type: string
          default: ""
        actor_name:
          type: string
          default: ""
        action:
          type: string
        method:
          type: string
          default: ""
        path:
          type: string
          default: ""
        target_type:
          type: string
          default: ""
        target_id:
          type: string
          default: ""
        summary:
          type: string
        detail:
          type: string
          default: ""
    AuditList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
    RepoRuleFile:
      type: object
      required: [path, enabled, body, html]
      properties:
        path:
          type: string
        enabled:
          type: boolean
        body:
          type: string
        html:
          type: string
          description: The body rendered as HTML for the page. Raw HTML in the file is escaped.
    RepoRuleList:
      type: object
      required: [branch, files]
      properties:
        branch:
          type: string
          default: ""
        files:
          type: array
          items:
            $ref: "#/components/schemas/RepoRuleFile"
    RepoRuleWrite:
      type: object
      required: [path, enabled]
      properties:
        workspace:
          type: string
          default: ""
        path:
          type: string
        enabled:
          type: boolean
    EndpointCredential:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: string
    EndpointWrite:
      type: object
      required: [name, provider]
      properties:
        name:
          type: string
        provider:
          type: string
        base_url:
          type: string
          default: ""
        api_key:
          type: string
          default: ""
        auth:
          type: string
          default: key
        audience:
          type: string
          default: ""
    ProjectModel:
      type: object
      required: [id, name, provider, model_name, endpoint_name, org_enabled, enabled]
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        model_name:
          type: string
        endpoint_name:
          type: string
          default: ""
        org_enabled:
          type: boolean
        enabled:
          type: boolean
        endpoint_id:
          type: string
          default: ""
        auth:
          type: string
          default: key
        signed_in:
          type: boolean
          default: true
    ProjectModelList:
      type: object
      required: [can_manage, models]
      properties:
        can_manage:
          type: boolean
        models:
          type: array
          items:
            $ref: "#/components/schemas/ProjectModel"
    AgentTeamStep:
      type: object
      required: [key, job]
      properties:
        key:
          type: string
        job:
          type: string
        after:
          type: array
          items:
            type: string
        paths:
          type: array
          items:
            type: string
    AgentTeamWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
        job:
          type: string
          default: ""
        instruction:
          type: string
          default: ""
        model_id:
          type: string
          default: ""
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AgentTeamStep"
    AgentTeamUpdate:
      type: object
      required: [name, instruction, model_id, steps]
      properties:
        name:
          type: string
        instruction:
          type: string
        model_id:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AgentTeamStep"
    ClaudeLinkWrite:
      type: object
      required: [client_id, assertion_file]
      properties:
        client_id:
          type: string
        assertion_file:
          type: string
        profile_api_key:
          type: string
          default: ""
    PriceWrite:
      type: object
      required: [model, input_per_mtok, output_per_mtok]
      properties:
        provider:
          type: string
          default: ""
        model:
          type: string
        input_per_mtok:
          type: number
        output_per_mtok:
          type: number
        cache_read_per_mtok:
          type: number
          default: 0
        cache_write_per_mtok:
          type: number
          default: 0
    AgentTeamImport:
      type: object
      properties:
        path:
          type: string
          default: ""
    AgentTeamProjectWrite:
      type: object
      required: [team_id, enabled]
      properties:
        path:
          type: string
          default: ""
        team_id:
          type: string
        enabled:
          type: boolean
    ProjectModelWrite:
      type: object
      required: [model_id, enabled]
      properties:
        path:
          type: string
          default: ""
        model_id:
          type: string
        enabled:
          type: boolean
    RepoEnabled:
      type: object
      required: [project_id, enabled]
      properties:
        project_id:
          type: string
        enabled:
          type: boolean
    TaskActor:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    TaskGate:
      type: object
      required: [action, at, actor]
      properties:
        action:
          type: string
        at:
          type: string
        note:
          type: string
          default: ""
        actor:
          $ref: "#/components/schemas/TaskActor"
